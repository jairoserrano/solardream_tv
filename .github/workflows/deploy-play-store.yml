name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy Release to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Release Keystore & Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > solardream-release.jks
          cat <<EOF > key.properties
          storeFile=solardream-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Release Bundle (AAB) & APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Verify Build Artifacts
        run: |
          ls -la app/build/outputs/bundle/release/app-release.aab
          ls -la app/build/outputs/apk/release/app-release.apk
          ls -la app/build/outputs/mapping/release/mapping.txt

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: dev.jairoserrano.solardream
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'production' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Upload Build Artifacts to GitHub Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solardream-release-artifacts
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub Release (on tag push)
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
